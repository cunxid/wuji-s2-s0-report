<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The generated trajectory in 3D (one case)</title><style>
:root{color-scheme:light;--page:#ffffff;--text-primary:#191919;--text-secondary:#666666;--line:#dddddd;--head:#eceef1}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#191919;--text-primary:#efefef;--text-secondary:#9c9c9c;--line:#333333;--head:#24272b}}
html,body{margin:0;padding:0}body{font:13px/1.4 system-ui,sans-serif;color:var(--text-primary);background:var(--page)}
.viewer{padding:2px}.viewer:focus{outline:none}
.vbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 4px;font-size:12px}
.vbar button,.vbar select{font:inherit;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--head);color:var(--text-primary);cursor:pointer}
.vbar .vhint{color:var(--text-secondary);margin-left:auto}.vsel{display:none}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}@media (max-width:430px){.tgrid{grid-template-columns:1fr}}
.tview h3{margin:0 0 2px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vwrap{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vwrap canvas{display:block;width:100%;height:250px;touch-action:none;cursor:grab}
.vlabels{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.vlabel{position:absolute;left:0;top:0;font-size:10.5px;font-weight:700;line-height:1.1;padding:0 4px;border-radius:7px;white-space:nowrap;background:var(--page);color:var(--text-primary);border:1px solid var(--line);opacity:.9}
.vmsg{display:none;position:absolute;left:8px;top:8px;right:8px;padding:8px;border:1px dashed var(--line);border-radius:6px;background:var(--page);font-size:12px}
.tsub{font-size:11.5px;color:var(--text-secondary);margin-top:2px;min-height:30px}.tsub[data-side="0"]{visibility:hidden;height:0;min-height:0;overflow:hidden}
.vstrip{position:relative;display:flex;gap:1px;height:12px;margin:6px 0 0}.vseg{border:0;padding:0;min-width:1px;cursor:pointer;border-radius:1px}
.vev{position:absolute;top:-2px;width:3px;height:16px;margin-left:-1px;background:var(--text-primary);border:1px solid var(--page);pointer-events:none}
.vslider{display:block;width:100%;margin:3px 0 3px}.vread{font-size:11.5px;min-height:34px;color:var(--text-secondary)}.vread b{color:var(--text-primary)}
.vchip{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;margin:4px 0 0;font-size:11.5px;color:var(--text-secondary)}
.legend .item{display:inline-flex;gap:5px;align-items:center}.sw{display:inline-block;width:16px;height:9px;border-radius:2px;flex:none}
</style></head><body><div class="viewer" id="traj" tabindex="0"><div class="vbar"><select class="vsel" aria-hidden="true"></select><button type="button" class="vplay">play</button><label>speed <select class="vspeed"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></label><button type="button" class="vreset">reset view</button><span class="vhint">drag: turn · wheel: zoom · shift-drag: pan</span></div><div class="tgrid"><div class="tview"><h3 class="tname" data-side="0"></h3><div class="vwrap"><canvas></canvas><div class="vlabels"></div><div class="vmsg"></div></div><div class="tsub" data-side="0"></div></div><div class="tview"><h3 class="tname" data-side="1"></h3><div class="vwrap"><canvas></canvas><div class="vlabels"></div><div class="vmsg"></div></div><div class="tsub" data-side="1"></div></div></div><div class="vstrip"></div><input class="vslider" type="range" min="0" max="1" step="1" value="0" aria-label="row of the reference"><div class="vread"></div><div class="legend"><span class="item"><span class="sw" style="background:#257de0"></span>approach</span><span class="item"><span class="sw" style="background:#f47230"></span>grasp</span><span class="item"><span class="sw" style="background:#f2a600"></span>rise</span><span class="item"><span class="sw" style="background:#c2379a"></span>carry</span><span class="item"><span class="sw" style="background:#008a17"></span>release</span><span class="item"><span class="sw" style="background:#6a4ce2"></span>leave</span><span class="item">numbers: the agent's keypoints</span></div><noscript><p>This view needs JavaScript.</p></noscript></div><script src="trajectory/index.js"></script><script src="trajectory/viewer.js"></script></body></html>
